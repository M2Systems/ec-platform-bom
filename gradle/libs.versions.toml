[versions]
# Platform / Plugins
spotbugs = "6.0.12"
spotbugsAnnotations = "4.8.5"
dependencyCheck = "9.0.10"

# Logging (unified with dbtools)
log4j2 = "2.23.1"
slf4j = "2.0.12"

# Core Utilities & Networking
commonsCodec = "1.16.1"
commonsBeanutils = "1.9.4"
commonsNet = "3.10.0"
netty = "4.1.109.Final"
xstream = "1.4.20"
xalan = "2.7.3"

# Web Services & XML (Jakarta / Javax legacy compat on Java 17)
cxf = "4.0.4"
servletApi = "6.0.0"
jakartaMail = "2.0.1"
jakartaActivation = "2.0.1"
jaxbApi = "3.0.1"
jaxwsApi = "3.0.1"
jwsApi = "3.0.0"
ibmMq = "9.4.0.0"

# SSH
j2ssh = "0.2.9"

# Security
bouncycastle = "1.78.1"

# Testing
junit = "5.10.2"

[libraries]
# Logging
log4j-core = { group = "org.apache.logging.log4j", name = "log4j-core", version.ref = "log4j2" }
log4j-bridge = { group = "org.apache.logging.log4j", name = "log4j-1.2-api", version.ref = "log4j2" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
log4j-slf4j2-impl = { group = "org.apache.logging.log4j", name = "log4j-slf4j2-impl", version.ref = "log4j2" }

# Apache Commons & Utilities
commons-codec = { group = "commons-codec", name = "commons-codec", version.ref = "commonsCodec" }
commons-beanutils = { group = "commons-beanutils", name = "commons-beanutils", version.ref = "commonsBeanutils" }
commons-net = { group = "commons-net", name = "commons-net", version.ref = "commonsNet" }
netty-all = { group = "io.netty", name = "netty-all", version.ref = "netty" }
xstream = { group = "com.thoughtworks.xstream", name = "xstream", version.ref = "xstream" }
xalan = { group = "xalan", name = "xalan", version.ref = "xalan" }

# CXF & Web Services
cxf-rt-frontend-jaxws = { group = "org.apache.cxf", name = "cxf-rt-frontend-jaxws", version.ref = "cxf" }
cxf_rt_transports_http_jetty = { group = "org.apache.cxf", name = "cxf-rt-transports-http-jetty", version.ref = "cxf" }
cxf-rt-transports-http = { group = "org.apache.cxf", name = "cxf-rt-transports-http", version.ref = "cxf" }
cxf-rt-features-logging = { group = "org.apache.cxf", name = "cxf-rt-features-logging", version.ref = "cxf" }

# Servlet, Mail, Activation (Javax legacy specifications)
servlet-api = { group = "jakarta.servlet", name = "jakarta.servlet-api", version.ref = "servletApi" }
# Mail & Activation (Jakarta specifications)
jakarta-mail = { group = "com.sun.mail", name = "jakarta.mail", version.ref = "jakartaMail" }
jakarta-activation = { group = "com.sun.activation", name = "jakarta.activation", version.ref = "jakartaActivation" }

# Java 9+ compatibility for javax JAXB & JAX-WS
jaxb-api = { group = "jakarta.xml.bind", name = "jakarta.xml.bind-api", version.ref = "jaxbApi" }
jaxws-api = { group = "jakarta.xml.ws", name = "jakarta.xml.ws-api", version.ref = "jaxwsApi" }
jws-api = { group = "jakarta.jws", name = "jakarta.jws-api", version.ref = "jwsApi" }
ibm-mq-allclient = { group = "com.ibm.mq", name = "com.ibm.mq.allclient", version.ref = "ibmMq" }

# SSH
j2ssh-core = { group = "sshtools", name = "j2ssh-core", version.ref = "j2ssh" }

# Security
bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }

# Spotbugs
spotbugs-annotations = { group = "com.github.spotbugs", name = "spotbugs-annotations", version.ref = "spotbugsAnnotations" }

# Testing
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }

[plugins]
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs" }
dependencyCheck = { id = "org.owasp.dependencycheck", version.ref = "dependencyCheck" }
